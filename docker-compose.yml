services:
  redis:
    image: redis:latest
    container_name: redis-local
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: redis-portal
    env_file:
      - .env.local
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "3000:3000"
    volumes:
      - portal-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: always

volumes:
  redis-data:
    external: true
    name: redis-local-data
  portal-data:
